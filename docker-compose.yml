services:
  mysql:
    image: mysql:8.0
    container_name: cchord-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: cchorddb
      MYSQL_USER: cchord
      MYSQL_PASSWORD: cchordpass
    ports:
      - "14296:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      mysqld
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped

  app:
    build: .
    container_name: cchord-app
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cchorddb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: cchord
      SPRING_DATASOURCE_PASSWORD: cchordpass
    ports:
      - "8848:8848"
    restart: on-failure
volumes:
  mysql_data:
